services:
  mongo:
    image: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  app:
    build: .
    image: 869987460893.dkr.ecr.ap-southeast-2.amazonaws.com/flagship:1.0
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5173:5173"
    environment:
      MONGO_URI: mongodb://mongo:27017/ecommerce
      DB_HOST: mongo
      DB_PORT: 27017
      BACKEND_PORT: 5000
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongodata: