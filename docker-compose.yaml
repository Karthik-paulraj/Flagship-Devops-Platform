services:
  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  backend:
    build: ./backend
    image: flagship-backend:local
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env          # secrets stay on your machine, never in the image
    environment:                # these override values from .env
      MONGO_URI: mongodb://mongo:27017/ecommerce
      PORT: 5000
      BACKEND_PORT: 5000
      CLIENT_URL: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: flagship-frontend:local
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodata: